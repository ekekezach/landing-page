<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>No problem | AURASPAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&family=Oswald:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{ --black:#0a0a0a; --silver:#a7a39a; --light:#e8e4dc; --white:#f5f1e9; --accent:#B9B2A6; --font-display:'Cormorant Garamond', Georgia, serif; --font-body:'Inter', system-ui, sans-serif; --font-accent:'Oswald', sans-serif; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{ background:var(--black); color:var(--light); font-family:var(--font-body); font-weight:300; display:flex; align-items:center; justify-content:center; padding:48px 24px; -webkit-font-smoothing:antialiased; }
    main{ max-width:560px; width:100%; text-align:center; }
    .brand{ font-family:var(--font-accent); letter-spacing:.5em; font-size:12px; color:var(--accent); margin-bottom:56px; }
    .kicker{ font-family:var(--font-accent); letter-spacing:.3em; font-size:12px; color:var(--silver); text-transform:uppercase; margin-bottom:18px; }
    h1{ font-family:var(--font-display); font-weight:500; font-size:clamp(40px,8vw,64px); line-height:1.05; color:var(--white); margin-bottom:28px; }
    .rule{ width:56px; height:1px; background:var(--accent); margin:0 auto 28px; }
    .line{ font-size:17px; line-height:1.7; color:var(--light); margin-bottom:14px; }
    .cta{ display:inline-block; margin-top:36px; padding:16px 34px; border:1px solid var(--accent); color:var(--white); text-decoration:none; font-family:var(--font-accent); letter-spacing:.25em; font-size:13px; text-transform:uppercase; transition:background .2s,color .2s; }
    .cta:hover{ background:var(--accent); color:var(--black); }
    .sign{ margin-top:56px; font-family:var(--font-display); font-style:italic; font-size:20px; color:var(--silver); }
  </style>
</head>
<body>
  <main>
    <p class="brand">AURASPAN</p>
    <p class="kicker">Return to Form</p>
    <h1>No problem.</h1>
    <div class="rule"></div>
    <p class="line">Nothing changes. Your programme continues as planned.</p>
    <p class="line">Keep training. The standard stays the same.</p>
    <a class="cta" href="/">Back to AURASPAN</a>
    <p class="sign">Live Elevated.</p>
  </main>
</body>
</html>
